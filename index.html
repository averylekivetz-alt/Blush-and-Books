let books;
try {
  const savedBooks = JSON.parse(localStorage.getItem("blush-and-books-library"));
  books = Array.isArray(savedBooks) ? savedBooks : defaultBooks;
} catch {
  books = defaultBooks;
}
books = books.map(book => ({...book, photos: Array.isArray(book.photos) ? book.photos : []}));

function saveLibrary() {
  localStorage.setItem("blush-and-books-library", JSON.stringify(books));
}

function addBook(book) {
  const nextId = books.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
  const colors = [["#9f5f6b","#e8c2c8"],["#657d84","#d9e8e8"],["#8a6d52","#ead8bd"],["#655b76","#d9d0e8"]];
  const title = book.title.trim();
  const added = {
    id: nextId, title,
    author: book.author.trim() || "Unknown author",
    status: book.status || "Want to Read",
    rating: Number(book.rating) || 0,
    started: book.started || "", finished: book.finished || "",
    isbn: book.isbn || "", pages: Number(book.pages) || 0,
    loved: Number(book.rating) === 5, review: book.review || "", photos: [],
    cover: colors[nextId % colors.length],
    short: title.split(/\s+/).slice(0,3).join("\n").toUpperCase()
  };
  books.push(added);
  saveLibrary();
  return added;
}

async function lookupBooks(query) {
  const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=8&fields=title,author_name,isbn,number_of_pages_median`);
  if (!response.ok) throw new Error("Book search failed");
  const data = await response.json();
  return (data.docs || []).map((item, index) => {
    const title = item.title || "Untitled";
    return {
      id: `result-${index}`, title,
      author: item.author_name?.[0] || "Unknown author",
      isbn: item.isbn?.[0] || "", pages: item.number_of_pages_median || 0,
      status: "Want to Read", rating: 0, started: "", finished: "", loved: false, review: "",
      cover: [["#9f5f6b","#e8c2c8"],["#657d84","#d9e8e8"],["#8a6d52","#ead8bd"]][index % 3],
      short: title.split(/\s+/).slice(0,3).join("\n").toUpperCase()
    };
  });
}

let scannerStream = null;
let scannerFrame = 0;

function stopScanner() {
  cancelAnimationFrame(scannerFrame);
  scannerFrame = 0;
  scannerStream?.getTracks().forEach(track => track.stop());
  scannerStream = null;
}

async function showIsbnResults(isbn) {
  stopScanner();
  state.bookSearch = isbn;
  state.addMode = "search";
  state.searchBusy = true;
  render();
  try {
    state.searchResults = await lookupBooks(`isbn:${isbn}`);
    if (!state.searchResults.length) state.toast = "No book found for that ISBN";
  } catch {
    state.toast = "ISBN lookup needs an internet connection";
  }
  state.searchBusy = false;
  render();
}

async function startScanner() {
  if (!("BarcodeDetector" in window)) {
    state.toast = "Automatic scanning is not supported hereâ€”type the ISBN below";
    render();
    return;
  }
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    const video = document.querySelector("#barcode-video");
    video.srcObject = scannerStream;
    await video.play();
    document.querySelector("#scan-frame")?.classList.add("scanning");
    document.querySelector("#start-scan").hidden = true;
    document.querySelector("#stop-scan").hidden = false;
    const supported = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : [];
    const formats = ["ean_13","ean_8","upc_a","upc_e"].filter(format => supported.includes(format));
    const detector = new BarcodeDetector(formats.length ? {formats} : undefined);
    const detect = async () => {
      if (!scannerStream) return;
      try {
        const matches = await detector.detect(video);
        const isbn = matches.map(match => match.rawValue.replace(/[^0-9X]/gi, "")).find(value => value.length === 10 || value.length === 13);
        if (isbn) return showIsbnResults(isbn);
      } catch {}
      scannerFrame = requestAnimationFrame(detect);
    };
    detect();
  } catch {
    stopScanner();
    state.toast = "Camera access was unavailableâ€”type the ISBN below";
    render();
  }
}

function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const image = new Image();
      image.onerror = reject;
      image.onload = () => {
        const maxSide = 1200;
        const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(image.width * scale);
        canvas.height = Math.round(image.height * scale);
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", .72));
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function recognizeBookCover(file) {
  stopScanner();
  state.toast = "Reading the coverâ€”this may take a momentâ€¦";
  render();
  let worker;
  try {
    if (!window.Tesseract) throw new Error("OCR unavailable");
    const coverPhoto = await compressPhoto(file);
    worker = await Tesseract.createWorker("eng", 1, {
      logger: message => {
        if (message.status !== "recognizing text") return;
        const toast = document.querySelector(".toast");
        if (toast) toast.textContent = `Reading coverâ€¦ ${Math.round((message.progress || 0) * 100)}%`;
      }
    });
    const result = await worker.recognize(coverPhoto, {rotateAuto:true});
    const lines = [...new Set(result.data.text.split(/\r?\n/)
      .map(line => line.replace(/[^A-Za-z0-9'&:.,! ?-]/g, " ").replace(/\s+/g, " ").trim())
      .filter(line => /[A-Za-z]{2}/.test(line) && line.length >= 3 && line.length <= 80))];
    if (!lines.length) throw new Error("No text found");
    state.pendingCoverPhoto = coverPhoto;
    state.bookSearch = lines.slice(0, 4).join(" ");
    state.addMode = "search";
    state.searchBusy = true;
    render();
    let results = await lookupBooks(state.bookSearch);
    for (const line of lines.slice(0, 6)) {
      if (results.length) break;
      results = await lookupBooks(line);
      if (results.length) state.bookSearch = line;
    }
    state.searchResults = results;
    state.toast = results.length ? "Choose the matching book" : "I read the cover, but could not find a matchâ€”edit the search text and try again";
  } catch {
    state.pendingCoverPhoto = null;
    state.toast = "I could not read that coverâ€”try a brighter, straighter photo";
  } finally {
    await worker?.terminate();
    state.searchBusy = false;
    render();
  }
}

function bindEvents() {
  document.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", () => {
    stopScanner();
    state.screen = el.dataset.nav;
    render();
  }));
  document.querySelectorAll("[data-screen]").forEach(el => el.addEventListener("click", () => {
    state.screen = el.dataset.screen;
    render();
  }));
  document.querySelectorAll("[data-book]").forEach(el => el.addEventListener("click", () => {
    state.selectedBook = books.find(b => b.id === Number(el.dataset.book));
    state.screen = "detail";
    render();
  }));
  document.querySelectorAll("[data-filter]").forEach(el => el.addEventListener("click", () => {
    state.filter = el.dataset.filter;
    render();
  }));
  document.querySelector("#library-search")?.addEventListener("input", e => {
    state.search = e.target.value;
    render();
    const input = document.querySelector("#library-search");
    input?.focus();
    input?.setSelectionRange(state.search.length, state.search.length);
  });
  document.querySelectorAll("[data-mode]").forEach(el => el.addEventListener("click", () => {
    stopScanner();
    state.addMode = el.dataset.mode;
    render();
  }));
  document.querySelector("#book-search-form")?.addEventListener("submit", async e => {
    e.preventDefault();
    state.bookSearch = document.querySelector("#book-search").value.trim();
    state.searchBusy = true;
    render();
    try {
      state.searchResults = await lookupBooks(state.bookSearch);
      if (!state.searchResults.length) state.toast = "No books foundâ€”try another search";
    } catch {
      state.toast = "Book search needs an internet connection";
    }
    state.searchBusy = false;
    render();
  });
  document.querySelectorAll("[data-search-result]").forEach(el => el.addEventListener("click", () => {
    const added = addBook(state.searchResults[Number(el.dataset.searchResult)]);
    if (state.pendingCoverPhoto) {
      added.photos.push(state.pendingCoverPhoto);
      state.pendingCoverPhoto = null;
      saveLibrary();
    }
    state.selectedBook = added;
    state.screen = "detail";
    state.toast = `${added.title} was added`;
    render();
    setTimeout(() => { state.toast = ""; render(); }, 1800);
  }));
  document.querySelector("#isbn-form")?.addEventListener("submit", async e => {
    e.preventDefault();
    const isbn = String(new FormData(e.currentTarget).get("isbn")).replace(/[^0-9X]/gi, "");
    await showIsbnResults(isbn);
  });
  document.querySelector("#start-scan")?.addEventListener("click", startScanner);
  ["#cover-camera-input", "#cover-library-input"].forEach(selector => {
    document.querySelector(selector)?.addEventListener("change", e => {
      const file = e.target.files?.[0];
      if (file) recognizeBookCover(file);
    });
  });
  document.querySelector("#stop-scan")?.addEventListener("click", () => {
    stopScanner();
    document.querySelector("#scan-frame")?.classList.remove("scanning");
    document.querySelector("#start-scan").hidden = false;
    document.querySelector("#stop-scan").hidden = true;
  });
  document.querySelectorAll("[data-result]").forEach(el => el.addEventListener("click", () => {
    const b = books.find(x => x.id === Number(el.dataset.result));
    state.toast = `${b.title} is ready to add`;
    setTimeout(() => { state.toast = ""; render(); }, 1600);
    render();
  }));
  document.querySelectorAll("[data-rate]").forEach(el => el.addEventListener("click", () => {
    state.selectedBook.rating = Number(el.dataset.rate);
    if (state.selectedBook.rating === 5) state.selectedBook.loved = true;
    saveLibrary();
    render();
  }));
  document.querySelector("#love-toggle")?.addEventListener("click", () => {
    state.selectedBook.loved = !state.selectedBook.loved;
    saveLibrary();
    render();
  });
  document.querySelector("#photo-input")?.addEventListener("change", async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (state.selectedBook.photos.length >= 8) {
      state.toast = "You can attach up to 8 photos per book";
      render();
      return;
    }
    state.toast = "Preparing photoâ€¦";
    render();
    try {
      const photo = await compressPhoto(file);
      state.selectedBook.photos.push(photo);
      saveLibrary();
      state.toast = "Photo attached";
    } catch {
      state.selectedBook.photos.pop();
      state.toast = "That photo could not be savedâ€”try a smaller image";
    }
    render();
    setTimeout(() => { state.toast = ""; render(); }, 1800);
  });
  document.querySelectorAll("[data-remove-photo]").forEach(el => el.addEventListener("click", () => {
    const index = Number(el.dataset.removePhoto);
    if (!confirm("Remove this photo from the book?")) return;
    state.selectedBook.photos.splice(index, 1);
    saveLibrary();
    render();
  }));
  document.querySelector("#manual-form")?.addEventListener("submit", e => {
    e.preventDefault();
    const added = addBook(Object.fromEntries(new FormData(e.currentTarget)));
    state.selectedBook = added;
    state.toast = `${added.title} was added`;
    state.screen = "detail";
    render();
    setTimeout(() => { state.toast = ""; render(); }, 1800);
    return;
    state.toast = "Saved to your prototype library â™¡";
    state.screen = "library";
    render();
    setTimeout(() => { state.toast = ""; render(); }, 1800);
  });
  document.querySelector("#delete-book")?.addEventListener("click", () => {
    const book = state.selectedBook;
    if (!confirm(`Remove "${book.title}" from your library?`)) return;
    books = books.filter(item => item.id !== book.id);
    saveLibrary();
    state.selectedBook = books[0] || null;
    state.screen = "library";
    state.toast = `${book.title} was removed`;
    render();
    setTimeout(() => { state.toast = ""; render(); }, 1800);
  });
  document.querySelector("#edit-book")?.addEventListener("click", () => {
    state.screen = "edit";
    render();
  });
  document.querySelector("#edit-form")?.addEventListener("submit", e => {
    e.preventDefault();
    const data = new FormData(e.currentTarget);
    Object.assign(state.selectedBook, {
      title: data.get("title").trim(),
      author: data.get("author").trim(),
      isbn: data.get("isbn").trim(),
      status: data.get("status"),
      pages: Number(data.get("pages")) || 0,
      started: data.get("started").trim(),
      finished: data.get("finished").trim(),
      rating: Number(data.get("rating")),
      review: data.get("review").trim()
    });
    if (state.selectedBook.rating === 5) state.selectedBook.loved = true;
    saveLibrary();
    state.screen = "detail";
    state.toast = "Book updated";
    render();
    setTimeout(() => { state.toast = ""; render(); }, 1800);
  });
}

render();

  </script>
</body>
</html>
